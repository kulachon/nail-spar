/* Artwork edition: embedded AI scenery, shaded interactive vector art. */
:root{--paper:#fff8f0;--berry:#ad5374;--ink:#584051;--muted:#937b87;--line:#e9d9d6;--shadow:0 8px 24px #9d6c7610,0 2px 4px #9d6c7608}
body{background:#eee2dc}.app{background:linear-gradient(135deg,#fffaf2,#fff2f0 65%,#f4f5e9)}
.top{background:#fff9f0c9;border-bottom:1px solid #ffffffa0}.brand{letter-spacing:-.4px}.brand small{color:#b08488;font-size:11px;letter-spacing:2.2px}.coins{background:linear-gradient(145deg,#fff8dd,#f5dba3);border:1px solid #e9cea0;box-shadow:inset 0 2px 0 #ffffffd9,0 3px 0 #dec48d44}
.hero{margin-top:18px;border-radius:34px;border:4px solid #fffcf4;box-shadow:0 15px 35px #a5706926;isolation:isolate}.hero-art{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}.hero:after{content:'';position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#754d5525);pointer-events:none;z-index:0}.hero-tag{z-index:1;background:#fffaf0f5;border:1px solid #f0d9b9;box-shadow:0 4px 14px #78534320;font-weight:bold;color:#805570}
.intro h1{color:#795065}.eyebrow{font-size:11px;letter-spacing:1.6px;color:#ac7e89}.primary{background:linear-gradient(160deg,#c97894,#a54c70);border:1px solid #ad5978;box-shadow:inset 0 2px 0 #efbbcb90,0 5px 0 #88425f,0 8px 18px #a6557721;text-shadow:0 1px 1px #73324c40}.secondary{background:linear-gradient(145deg,#e4f1dd,#bcd9c8);border:1px solid #b9d3be;box-shadow:inset 0 2px 0 #ffffffba,0 3px 0 #adcab455}
.panel,.tools{background:linear-gradient(145deg,#fffefb,#fff9f5);border:1px solid #ead8d2;box-shadow:inset 0 2px 0 white,var(--shadow)}.tools{border-radius:28px}.home-nav button{background:linear-gradient(135deg,#fffdf6,#f9e8e7);border:1px solid #e5cfc9;box-shadow:inset 0 2px 0 white,0 4px 0 #dbc6c333}.icon-btn{background:linear-gradient(145deg,white,#fbeee9)}
.stage{border:3px solid #fffdf5;border-radius:34px;background-image:var(--art-table);background-size:cover;background-position:center;box-shadow:0 0 0 1px #e7d1c7,0 9px 24px #94685f1a}.stage-badge{z-index:2;top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffcf0e8;border-color:#ebdac4;color:#967168;font-size:12px;box-shadow:0 2px 8px #986e6510}.hand-stage>svg{position:relative;z-index:1}.mirror-stage{background-image:var(--art-mirror);min-height:380px;aspect-ratio:4/5;display:flex;align-items:flex-end;justify-content:center;padding:15% 10% 8%;overflow:hidden}.mirror-stage>svg{width:100%;height:auto;max-height:100%;filter:drop-shadow(0 5px 6px #88625618)}.mirror-stage .stage-badge{top:13px}.photo-stage{padding:15px 4px;background-position:center}
.swatch{border:5px solid #fffefa;box-shadow:0 1px 0 1px #e5d4cd,0 5px 8px #6e49621c,inset 0 3px 8px #ffffffa0,inset 0 -3px 5px #51425319}.swatch:before{content:'';position:absolute;left:9px;top:5px;width:26%;height:7px;border-radius:50%;background:#ffffff90}.swatch.selected{box-shadow:0 0 0 3px #a96484,0 5px 9px #6e496220}.chosen{background:linear-gradient(140deg,#f9e7ee,#efdfef)!important;outline-color:#bb91a9}
.tool-grid button{background:linear-gradient(140deg,#fffefa,#f9eee8);border-color:#ead8d2;box-shadow:inset 0 2px 0 white,0 3px 0 #e6d7d055}.tool-grid b{filter:drop-shadow(0 2px 1px #8f627322)}.tool-actions button{background:linear-gradient(white,#fbf2ed);border-color:#e6d7cf}.request-color{box-shadow:0 0 0 1px #dfcbbc,0 5px 10px #94645f19,inset 0 2px 8px #ffffff77}
.result-card{position:relative;isolation:isolate;background:linear-gradient(#fff8eccc,#ffe9e4ee),var(--art-hero) center/cover;border:3px solid #fffdf4;box-shadow:0 0 0 1px #e9d2be,0 12px 25px #9a6a6414}.result-stars{filter:drop-shadow(0 5px 0 #cf9c4028)}.photo{border:1px solid #f5e8dc;box-shadow:0 8px 20px #78535c26;padding:9px 9px 28px}.photo img{background:#fff4ec}.scene-banner{position:relative;isolation:isolate;padding:24px 18px;margin:4px 0 14px;min-height:144px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:26px;overflow:hidden;background:linear-gradient(90deg,#fff7edfa,#fff6ecd9 57%,#fff4eb30),var(--art-hero) center 46%/cover;border:1px solid #e9d3c6;box-shadow:var(--shadow)}.shop-banner{background-position:center,center 85%}.scene-banner h1{color:#84546b}.shop-item{border-color:#efdfd6}.shop-item button{background:linear-gradient(#fff7dc,#f3dca4);border:1px solid #e8cfa2}.album button{border:1px solid #e8d6c8;background:#fffdf7;box-shadow:0 5px 14px #97665c16}.album button:nth-child(even){transform:rotate(1.5deg)}.bottom{background:linear-gradient(#fff6ef00,#fff6efeF 28%,#fff6ef)}.counter i.on{background:#b6cfae;box-shadow:0 0 0 1px #92ad8c}.pill{background:#f5e5ee;color:#a26c87}.tip{background:#f7eee5;color:#987365}

.study-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(77,53,85,.48);backdrop-filter:blur(8px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}

.study-card h2{font-size:29px;margin:8px 0 0;color:#59446b}.study-sub{margin:4px 0 12px;font-size:19px;color:#77607c}

.study-card button{min-width:60px;min-height:64px;height:auto;font-size:21px;touch-action:manipulation}.study-choice{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:white;border:2px solid #e8dcee;border-radius:18px;padding:10px 14px;color:#51415e;box-shadow:0 4px 0 #eadfea;white-space:normal}.study-choice>span:first-child{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;background:#f6eaf3;font-size:17px;color:#886280}.study-choice b{font-weight:600;overflow-wrap:anywhere}.study-choice.study-correct{background:#e2f6e9;border-color:#9ed7b3;color:#285f40;opacity:1}.study-card button:active{transform:scale(.96)}.study-card button:focus-visible{outline:4px solid #9678cb;outline-offset:3px}.study-feedback{font-size:20px;min-height:28px;margin:15px 0 8px;color:#665374}.study-hint{font-size:19px;padding:12px;margin:8px 0 12px;background:#fff0c9;border-radius:16px;line-height:1.5}.study-foot{font-size:16px;color:#7b6c7e;margin:12px 0 0}

const SAVE_ASSETS=Object.entries(ART).map(([name,data])=>({token:'@LAMOON_ASSET_'+name+'@',encoded:encodeURIComponent(data)}));
const SAVE_IMAGE_CACHE=new Map();
function encodeSave(value){return JSON.stringify(value,(key,v)=>{if(key==='image'&&typeof v==='string'){if(SAVE_IMAGE_CACHE.has(v))return SAVE_IMAGE_CACHE.get(v);const original=v;for(const a of SAVE_ASSETS)v=v.split(a.encoded).join(a.token);if(SAVE_IMAGE_CACHE.size>=16)SAVE_IMAGE_CACHE.clear();SAVE_IMAGE_CACHE.set(original,v);}return v;});}
function decodeSave(raw){return JSON.parse(raw,(key,v)=>{if(key==='image'&&typeof v==='string'){for(const a of SAVE_ASSETS)v=v.split(a.token).join(a.encoded);}return v;});}
function validSave(v){return v&&v.version===1&&Array.isArray(v.album)&&Array.isArray(v.patterns)&&Array.isArray(v.cats);}

function noise(duration=.16,wind=false){if(!audioCtx)return null;const source=audioCtx.createBufferSource(),buffer=audioCtx.createBuffer(1,Math.ceil(audioCtx.sampleRate*(wind?2:duration)),audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;source.buffer=buffer;source.loop=wind;const filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();filter.type=wind?'lowpass':'bandpass';filter.frequency.value=wind?650:2200;gain.gain.value=wind?.11:.075;source.connect(filter);filter.connect(gain);gain.connect(audioMaster);source.start();if(!wind)source.stop(audioCtx.currentTime+duration);return {source,gain};}
function playSound(kind){if(!state.settings.sound)return;unlockAudio();if(!audioCtx)return;try{if(kind==='file'){noise();return;}if(kind==='wind'){noise(.25);return;}if(kind==='wow'){const o=audioCtx.createOscillator(),filter=audioCtx.createBiquadFilter(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(390,t+.19);o.frequency.exponentialRampToValueAtTime(240,t+.65);filter.type='bandpass';filter.Q.value=5;filter.frequency.setValueAtTime(500,t);filter.frequency.exponentialRampToValueAtTime(1300,t+.17);filter.frequency.exponentialRampToValueAtTime(480,t+.65);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.1,t+.05);g.gain.linearRampToValueAtTime(.001,t+.7);o.connect(filter);filter.connect(g);g.connect(audioMaster);o.start();o.stop(t+.72);[523,659,784,1047].forEach((f,i)=>note(f,.72+i*.1,.2,.08));return;}const tones=kind==='sticker'?[1047,1568]:kind==='happy'?[659,880,1047]:kind==='reward'?[523,659,784]:[784,1047];tones.forEach((f,i)=>note(f,i*.09,.2,.09));}catch(_){}}
function beginWindSound(){if(!state.settings.sound||windSource)return;unlockAudio();try{windSource=noise(2,true);}catch(_){}}
function stopWindSound(){if(windSource){try{windSource.source.stop();}catch(_){}windSource=null;}}
function feedbackSettings(){settingsOpen=true;let el=$('#feedback-settings');if(!el){el=document.createElement('div');el.id='feedback-settings';el.className='modal';document.body.append(el);}el.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-label="เสียงและสั่น"><h2>เสียงและสั่น</h2><div class="row gap">${btn('toggle-sound',state.settings.sound?'🔊 เปิด':'🔇 ปิด','secondary',`aria-label="เสียง ${state.settings.sound?'เปิด':'ปิด'}" aria-pressed="${state.settings.sound}"`)}${btn('toggle-haptics',state.settings.haptics?'📳 เปิด':'📴 ปิด','secondary',`aria-label="สั่น ${state.settings.haptics?'เปิด':'ปิด'}" aria-pressed="${state.settings.haptics}"`)}</div>${btn('settings-close','✓ เล่นต่อ','primary wide gap')}</div>`;$('#app').inert=true;el.querySelector('button')?.focus();}
function closeFeedback(){settingsOpen=false;const el=$('#feedback-settings');if(el)el.remove();$('#app').inert=!!state.studyQuiz;}
function fileDust(x,y){const stage=$('#stage');if(!stage)return;const rect=stage.getBoundingClientRect(),px=Number.isFinite(x)?x-rect.left:rect.width*.5,py=Number.isFinite(y)?y-rect.top:rect.height*.23;for(let i=0;i<13;i++){const el=document.createElement('i');el.className='nail-dust';el.style.left=px+'px';el.style.top=py+'px';el.style.setProperty('--dx',(Math.random()*100-50)+'px');el.style.setProperty('--dy',(Math.random()*65+15)+'px');stage.append(el);setTimeout(()=>el.remove(),650);}}

function wetness(){return Math.max(.12,1-((R()?.dryAmount??R()?.dry??0)/5)*.88);}
function syncDry(){const pct=Math.min(100,Math.round((R()?.dryAmount||0)*20));const fill=$('#dry-fill');if(fill)fill.style.width=pct+'%';const bar=$('#dry-progress');if(bar)bar.setAttribute('aria-valuenow',pct);document.querySelectorAll('.wet-sheen').forEach(el=>el.setAttribute('opacity',wetness()));}

function startFan(e){if(fanHold||!R()||R().step!==8||R().dry>=5||state.studyQuiz)return;const target=e.target.closest('[data-action="dry-help"]');fanHold={pointer:e.pointerId,round:R(),last:performance.now(),started:performance.now(),advanced:false,timer:null};fanHold.timer=setInterval(fanFrame,40);target?.classList.add('fan-held');try{target?.setPointerCapture(e.pointerId);}catch(_){}$('#stage')?.classList.add('fan-running');beginWindSound();e.preventDefault();}
function fanFrame(){if(!fanHold)return;if(document.hidden||R()!==fanHold.round||screen!=='game'||R().step!==8||state.studyQuiz){stopFan();return;}const now=performance.now(),dt=Math.min(150,Math.max(0,now-fanHold.last));fanHold.last=now;fanHold.advanced=fanHold.advanced||now-fanHold.started>=150;R().dryAmount=Math.min(5,(R().dryAmount??R().dry)+dt/1100);R().dry=Math.floor(R().dryAmount);syncDry();if(R().dry>=5){playSound('happy');pulse(20);stopFan();}}
function stopFan(e=null,cancel=true){if(!fanHold)return false;if(e&&e.pointerId!==fanHold.pointer)return false;const hold=fanHold;fanHold=null;clearInterval(hold.timer);stopWindSound();$('#stage')?.classList.remove('fan-running');if(R()===hold.round){if(!cancel&&!hold.advanced&&R().dry<5){R().dryAmount=Math.min(5,Math.floor(R().dryAmount)+1);R().dry=Math.floor(R().dryAmount);playSound(R().dry>=5?'happy':'wind');}save();if(screen==='game'&&R().step===8)refreshHand();}suppressClickUntil=performance.now()+350;return true;}
document.addEventListener('pointerdown',()=>unlockAudio(),{capture:true,passive:true});
document.addEventListener('keydown',()=>unlockAudio(),{capture:true});
document.addEventListener('keydown',e=>{if(!settingsOpen)return;const layer=$('#feedback-settings'),buttons=Array.from(layer?.querySelectorAll('button')||[]);if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeFeedback();return;}if(e.key==='Tab'&&buttons.length){const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}e.stopImmediatePropagation();}},true);
window.addEventListener('blur',()=>stopFan());
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopFan();save();}});

upgradeProgress();
home();

// Remove a pending timer question when upgrading an existing session.
if(state.studyMode!=='checkpoints-v1'){state.studyQuiz=null;state.studyMode='checkpoints-v1';}
delete state.studyElapsed;
if(!Array.isArray(state.studyDeck))state.studyDeck=[];
state.studyDeck=state.studyDeck.filter(i=>Number.isInteger(i)&&STUDY_BANK[i]);
if(!Number.isInteger(state.studyLast))state.studyLast=-1;
if(!Number.isInteger(state.studyAnswered))state.studyAnswered=0;
if(state.studyQuiz&&(!STUDY_BANK[state.studyQuiz.index]||!Array.isArray(state.studyQuiz.order)||state.studyQuiz.order.length!==4||new Set(state.studyQuiz.order).size!==4||!state.studyQuiz.order.every(i=>Number.isInteger(i)&&i>=0&&i<4)))state.studyQuiz=null;
if(state.studyQuiz&&(!R()||!['nails','makeup'].includes(state.studyQuiz.stage)||R().step!==(state.studyQuiz.stage==='nails'?8:9)))state.studyQuiz=null;
let studyOverflow='';
function studyShuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function studyNextQuestion(){
 if(!state.studyDeck.length){state.studyDeck=studyShuffle(STUDY_BANK.map((_,i)=>i));if(state.studyDeck.at(-1)===state.studyLast){const last=state.studyDeck.length-1;[state.studyDeck[0],state.studyDeck[last]]=[state.studyDeck[last],state.studyDeck[0]];}}
 return state.studyDeck.pop();
}
function studyOpen(stage){
 if(!R())return;
 if(!state.studyQuiz){if(!['nails','makeup'].includes(stage)||R().studyDone?.[stage])return;state.studyQuiz={index:studyNextQuestion(),order:studyShuffle([0,1,2,3]),tries:0,solved:false,stage};}
 drag?.ghost?.remove();drag=null;stroke=null;suppressClickUntil=0;
 if(!$('#study-overlay')){studyOverflow=document.body.style.overflow;const layer=document.createElement('div');layer.id='study-overlay';layer.className='study-overlay';document.body.append(layer);document.body.style.overflow='hidden';}
 $('#app').inert=true;studyRender();save();
}
function studyRender(showHint=false){
 const pending=state.studyQuiz,layer=$('#study-overlay');if(!pending||!layer)return;
 const q=STUDY_BANK[pending.index];
 layer.innerHTML=`<section class="study-card" role="dialog" aria-modal="true" aria-labelledby="study-heading" aria-describedby="study-question"><div class="study-icon" aria-hidden="true">${pending.solved?'🌟':q.icon}</div><h2 id="study-heading">อังกฤษ ป.3</h2><p class="study-sub">${pending.stage==='nails'?'จบทาเล็บแล้ว 🎨':'จบแต่งหน้าแล้ว 💄'}</p><p id="study-question" lang="en">${q.q}</p><div class="study-choices">${pending.order.map((i,pos)=>`<button type="button" data-action="study-answer" data-value="${i}" class="study-choice ${pending.solved&&i===q.a?'study-correct':''}" ${pending.solved?'disabled':''}><span aria-hidden="true">${'ABCD'[pos]}</span><b lang="en">${q.choices[i]}</b>${pending.solved&&i===q.a?'<span aria-label="ถูกต้อง">✓</span>':''}</button>`).join('')}</div><p class="study-feedback" role="status" aria-live="polite">${pending.solved?(pending.tries===0&&!R()?.free?'เก่งมาก! โบนัส +10 🪙':'เก่งมากเลย 🌟'):pending.tries>0?'ลองอีกครั้งนะ 🌱':''}</p>${showHint||pending.tries>=2?`<p class="study-hint">💡 ${q.h}</p>`:''}${pending.solved?'<button type="button" class="primary wide" data-action="study-continue">🎨 เล่นต่อ</button>':'<button type="button" class="secondary wide" data-action="study-hint">💡 ขอคำใบ้</button>'}<p class="study-foot">ตอบถูก แล้วเล่นต่อกัน</p></section>`;
 layer.querySelector(pending.solved?'[data-action="study-continue"]':'[data-action="study-answer"]')?.focus({preventScroll:true});
}
function studyAnswer(value){
 const pending=state.studyQuiz;if(!pending||pending.solved||!pending.order.includes(value))return;
 if(value===STUDY_BANK[pending.index].a){pending.solved=true;state.studyAnswered++;if(R()&&pending.tries===0){R().quizFirst??={};R().quizFirst[pending.stage]=true;}playSound('happy');studyRender();sparkle(innerWidth/2,innerHeight/3,true);}else{pending.tries++;studyRender();}
 save();
}
function studyContinue(){
 if(!state.studyQuiz?.solved)return;
 const stage=state.studyQuiz.stage;state.studyLast=state.studyQuiz.index;state.studyQuiz=null;
 if(R()){R().studyDone??={};R().studyDone[stage]=true;R().step=stage==='nails'?9:10;erase=false;}
 $('#study-overlay')?.remove();$('#app').inert=false;document.body.style.overflow=studyOverflow;
 save();game();window.scrollTo(0,0);
 $('#app').querySelector('[data-action="next"], [data-action="capture"]')?.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{
 if(!state.studyQuiz)return;const layer=$('#study-overlay');
 if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();return;}
 const controls=Array.from(layer.querySelectorAll('button:not([disabled])'));
 if(e.key==='Tab'&&controls.length){const first=controls[0],last=controls.at(-1);if(e.shiftKey&&(document.activeElement===first||!layer.contains(document.activeElement))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||!layer.contains(document.activeElement))){e.preventDefault();first.focus();}e.stopImmediatePropagation();}
 else if(!layer.contains(e.target)){e.preventDefault();e.stopImmediatePropagation();controls[0]?.focus();}
},true);
save();
if(state.studyQuiz){game();studyOpen();}
